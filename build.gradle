/**
 * Top-level build file for ftc_app project.
 *
 * It is extraordinarily rare that you will ever need to edit this file.
 */

buildscript {
    ext {
        agp_version = '8.6.0'
        agp_version1 = '7.2.0'
        agp_version2 = '8.3.0'
        agp_version3 = '8.7.3'
        agp_version4 = '8.5.2'
        agp_version5 = '8.8.0'
        agp_version6 = '8.5.1'
        agp_version7 = '8.8.2'
        agp_version8 = '8.9.2'
        agp_version9 = '8.9.3'
        agp_version10 = '8.5.2'
        agp_version11 = '8.5.2'
        agp_version12 = '8.9.3'
        agp_version13 = agp_version4
    }
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        // Note for FTC Teams: Do not modify this yourself.
        classpath "com.android.tools.build:gradle:$agp_version13"
    }
}

// This is now required because aapt2 has to be downloaded from the
// google() repository beginning with version 3.2 of the Android Gradle Plugin
allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

repositories {
    mavenCentral()
}
